<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeuroSpace</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --indigo: #6366f1;
        --cyan: #22d3ee;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 300px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 16px;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
      }
      .logo {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--indigo), var(--cyan));
      }
      h1 {
        font-size: 15px;
        font-weight: 700;
      }
      .score-box {
        background: var(--card);
        border-radius: 12px;
        padding: 16px;
        text-align: center;
        margin-bottom: 12px;
      }
      .score {
        font-size: 42px;
        font-weight: 800;
        line-height: 1;
        color: var(--indigo);
      }
      .status {
        margin-top: 6px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .recommendation {
        font-size: 12px;
        color: var(--muted);
        margin-top: 8px;
        line-height: 1.4;
      }
      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--card);
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 10px;
      }
      .toggle-row span {
        font-size: 13px;
        font-weight: 600;
      }
      .switch {
        position: relative;
        width: 42px;
        height: 24px;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background: #475569;
        border-radius: 24px;
        transition: 0.2s;
      }
      .slider::before {
        content: "";
        position: absolute;
        height: 18px;
        width: 18px;
        left: 3px;
        bottom: 3px;
        background: #fff;
        border-radius: 50%;
        transition: 0.2s;
      }
      input:checked + .slider {
        background: var(--indigo);
      }
      input:checked + .slider::before {
        transform: translateX(18px);
      }
      .links {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }
      .links button {
        flex: 1;
        background: transparent;
        border: 1px solid #334155;
        color: var(--text);
        border-radius: 8px;
        padding: 8px;
        font-size: 12px;
        cursor: pointer;
      }
      .links button:hover {
        background: var(--card);
      }
      .warn {
        font-size: 11px;
        color: #fbbf24;
        margin-top: 8px;
        text-align: center;
      }
      .test-tools {
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px dashed #334155;
      }
      .test-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .test-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .test-btn {
        border: none;
        border-radius: 8px;
        padding: 8px;
        font-size: 12px;
        font-weight: 600;
        color: #fff;
        cursor: pointer;
      }
      .test-btn:hover {
        opacity: 0.9;
      }
      .t-fatigue {
        background: #ef4444;
      }
      .t-warning {
        background: #eab308;
      }
      .t-recovering {
        background: #6366f1;
      }
      .t-optimal {
        background: #22c55e;
      }
      .test-hint {
        font-size: 11px;
        color: var(--muted);
        margin-top: 8px;
        text-align: center;
        min-height: 14px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo"></div>
      <h1>NeuroSpace</h1>
    </div>

    <div class="score-box">
      <div class="score" id="score">--</div>
      <div class="status" id="status">Veri bekleniyor</div>
      <div class="recommendation" id="recommendation"></div>
    </div>

    <div class="toggle-row">
      <span>Takip aktif</span>
      <label class="switch">
        <input type="checkbox" id="trackingToggle" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="warn" id="authWarn" style="display: none">
      Oturum süresi doldu. Ayarlardan tekrar giriş yapın.
    </div>

    <div class="links">
      <button id="openOptions">Ayarlar</button>
      <button id="openDashboard">Panel</button>
    </div>

    <div class="test-tools">
      <div class="test-label">Test araçları (deneme amaçlı)</div>
      <div class="test-grid">
        <button class="test-btn t-fatigue" data-status="FATIGUED">Yorgunluk</button>
        <button class="test-btn t-warning" data-status="WARNING">Uyarı</button>
        <button class="test-btn t-recovering" data-status="RECOVERING">Toparlanma</button>
        <button class="test-btn t-optimal" data-status="OPTIMAL">Akış</button>
      </div>
      <div class="test-hint" id="testHint"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
